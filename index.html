<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Trivenkem · Sample Godown</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header class="hdr"><div class="in">
 <div class="brand"><span class="mk">T</span><div><b>Trivenkem</b><small>Sample Godown</small></div></div>
 <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" placeholder="Search by name, code, rack, scent or notes" autocomplete="off"><kbd>/</kbd></div>
 <div class="acts">
  <button class="cta" id="bAdd">+ Add sample</button>
  <button class="ghost" id="bExp">Export ▾</button>
  <button class="ghost" id="bImp">Import</button>
  <button class="ghost" id="bSet">Colours</button>
 </div>
</div></header>
<nav class="chips" id="chips"></nav>
<div class="wrap">
 <aside class="panel" id="panel"></aside>
 <section class="res">
  <div class="bar">
   <div><b id="cnt"></b><span id="sum"></span></div>
   <div class="r"><button class="ghost mb" id="bFil">Filters</button>
    <select id="sort"><option value="name">Sort: Name A–Z</option><option value="loc">Sort: Location</option><option value="new">Sort: Recently added</option></select></div>
  </div>
  <div class="grid" id="grid"></div>
 </section>
</div>
<input type="file" id="file" accept=".csv,.json" hidden>
<div class="menu" id="menu"></div>
<div class="modal" id="mod"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body></html>
