<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2b1141">
<title>Trivenkem · Sample Godown</title>
<link rel="stylesheet" href="style.css?v=4">
</head><body>
<header class="hdr">
 <div class="in">
  <div class="brand"><span class="mk">T</span><div><b>Trivenkem</b><small>Sample Godown</small></div></div>
  <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
   <input id="q" type="search" placeholder="Search name, code, rack, scent, notes" autocomplete="off"><button class="qc" id="qc" hidden aria-label="Clear search">✕</button><div class="sug" id="sug"></div></div>
  <div class="acts">
   <button class="cta" data-act="add">+ Add sample</button>
   <button class="ghost" data-act="exp">Export</button>
   <button class="ghost" data-act="imp">Import</button>
   <button class="ghost" data-act="set">Colours</button>
  </div>
 </div>
 <nav class="chips" id="chips"></nav>
</header>
<main class="wrap">
 <aside class="panel" id="panel"></aside>
 <section class="res">
  <div class="stats" id="stats"></div>
  <div class="active" id="active"></div>
  <div class="bar"><div class="bl"><button class="btn tg" id="tgl" data-act="tgl">« Hide filters</button><b id="cnt"></b></div>
   <select id="sort"><option value="name">Sort: Name A–Z</option><option value="loc">Sort: Location</option><option value="new">Sort: Recently added</option></select></div>
  <div class="grid" id="grid"></div>
 </section>
</main>
<nav class="tabs">
 <button data-act="fil"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>Filters</button>
 <button data-act="imp"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>Import</button>
 <button class="plus" data-act="add" aria-label="Add sample"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
 <button data-act="exp"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0-4 4m4-4 4 4M4 17v3h16v-3"/></svg>Export</button>
 <button data-act="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Colours</button>
</nav>
<div class="scrim" id="scrim"></div>
<input type="file" id="file" multiple hidden>
<input type="file" id="bfile" accept="image/*" multiple hidden>
<input type="file" id="pfile" accept="image/*" hidden>
<div class="menu" id="menu"></div>
<div class="modal" id="mod"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js?v=4"></script>
</body></html>
